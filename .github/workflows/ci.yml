# CPU-only checks: no model download, no GPU, no inference requests.
# Windows is included because the demo targets Windows laptops and the
# runner's default core.autocrlf=true exercises the evidence-hash path.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install report and web dependencies
        run: python -m pip install -r report-requirements.txt -r web-requirements.txt
      - name: Core CPU tests
        run: python -m unittest discover -s tests -v
      - name: Readiness test
        run: python -m unittest test_readiness -v
      - name: Web API tests
        run: python -m unittest discover -s web_tests -v
      - name: Real historical data check (hashes, 24 runs / 1536 requests)
        run: python scripts/check-demo-data.py
